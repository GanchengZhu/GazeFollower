name: Publish to PyPI

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  test:
    name: Run tests before publishing
    runs-on: ubuntu-latest
    env:
      SDL_VIDEODRIVER: "dummy"
      SDL_AUDIODRIVER: "dummy"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libegl1 libgles2 libgl1-mesa-glx libgl1-mesa-dri || sudo apt-get install -y libgl1 libglib2.0-0t64 libegl1 libgles2 || true
          sudo apt-get install -y libasound2-dev libasound2 || true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pytest
          pip install -e .

      - name: Run pytest
        run: |
          python -m pytest -v tests/

  build-and-publish:
    name: Build package and publish to PyPI
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Mandatory for trusted publishing if used
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packaging tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
